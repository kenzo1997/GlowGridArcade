<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missile Command - GlowGrid Arcade</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue:   #00d2ff;
            --neon-pink:   #ff0055;
            --neon-green:  #00ff88;
            --neon-purple: #bf00ff;
            --neon-orange: #ff8800;
            --bg:          #080c18;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        /* Light mode */
        body.light {
            --neon-blue:   #0077cc;
            --neon-pink:   #cc0044;
            --neon-green:  #00aa55;
            --neon-purple: #8800cc;
            --neon-orange: #cc6600;
            --bg:          #f0f3f8;
            color: #1a1a2e;
        }
        body.light::before { opacity: 0.2; }
        body.light h1 { color: var(--neon-pink); text-shadow: 0 0 12px var(--neon-pink); }
        body.light .score-board { color: #1a1a2e; }
        body.light .score-item span { color: #1a1a2e; }
        body.light .ammo-display { color: #1a1a2e; }
        body.light .controls { color: #556677; }
        body.light .overlay { background: rgba(240,243,248,0.92); color: #1a1a2e; }
        body.light .overlay button { border-color: var(--neon-pink); color: var(--neon-pink); }
        body.light .overlay button:hover { background: var(--neon-pink); color: #fff; }
        body.light #gameCanvas { background: #e8ecf2; }

        .game-container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--neon-pink);
            text-shadow: 0 0 12px var(--neon-pink), 0 0 40px rgba(255,0,85,0.3);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .score-item {
            color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .score-item span {
            color: #fff;
            font-weight: 700;
        }

        #gameCanvas {
            border: 3px solid var(--neon-pink);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(255,0,85,0.3), inset 0 0 60px rgba(255,0,85,0.05);
            background: #0a0f1a;
            display: block;
            cursor: crosshair;
        }

        .controls {
            margin-top: 15px;
            color: #667788;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .controls kbd {
            background: #1a2a4a;
            color: var(--neon-blue);
            padding: 4px 10px;
            border-radius: 4px;
            margin: 0 3px;
            font-family: 'Share Tech Mono', monospace;
            border: 1px solid var(--neon-blue);
        }

        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(8, 12, 24, 0.95);
            border: 2px solid var(--neon-pink);
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            z-index: 10;
            display: none;
        }

        .overlay.active { display: block; }

        .overlay h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--neon-pink);
            text-shadow: 0 0 12px var(--neon-pink);
            margin-bottom: 15px;
        }

        .overlay p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #aabbcc;
            line-height: 1.6;
        }

        .overlay button {
            background: var(--neon-pink);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 4px 0 #880022;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .overlay button:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #880022;
        }

        .ammo-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .ammo-item {
            color: var(--neon-orange);
            text-shadow: 0 0 8px var(--neon-orange);
        }

        .ammo-item span {
            color: #fff;
            font-weight: 700;
        }

        @media (max-width: 650px) {
            #gameCanvas { max-width: 95vw; }
            h1 { font-size: 1.6rem; }
            .score-board { gap: 15px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Missile Command</h1>
        <div class="score-board">
            <div class="score-item">SCORE: <span id="score">0</span></div>
            <div class="score-item">WAVE: <span id="wave">1</span></div>
            <div class="score-item">BEST: <span id="highScore">0</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="450"></canvas>
        <div class="ammo-display">
            <div class="ammo-item">BATTERIES: <span id="ammo">30</span></div>
            <div class="ammo-item">CITIES: <span id="cities">6</span></div>
        </div>
        <div class="controls">
            Click or tap to launch counter-missiles
        </div>

        <div class="overlay" id="startOverlay">
            <h2>MISSILE COMMAND</h2>
            <p>Defend your cities from incoming missiles!<br>Click to launch counter-missiles.</p>
            <button id="startBtn">START</button>
        </div>

        <div class="overlay" id="gameOverOverlay">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn">RETRY</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const waveEl = document.getElementById('wave');
        const highScoreEl = document.getElementById('highScore');
        const ammoEl = document.getElementById('ammo');
        const citiesEl = document.getElementById('cities');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        let score = 0;
        let highScore = localStorage.getItem('missile_command_best') || 0;
        let wave = 1;
        let ammo = 30;
        let cities = [];
        let missiles = [];
        let explosions = [];
        let enemyMissiles = [];
        let gameRunning = false;
        let lastTime = 0;
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 2000;

        highScoreEl.textContent = highScore;

        function initCities() {
            cities = [];
            const positions = [50, 120, 190, 260, 330, 400, 470, 550];
            for (let i = 0; i < 6; i++) {
                const x = positions[Math.floor(Math.random() * positions.length)];
                cities.push({ x: x + 30, y: canvas.height - 20, alive: true, radius: 20 });
            }
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0f1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw ground
            ctx.fillStyle = '#1a2a3a';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);

            // Draw cities
            cities.forEach(city => {
                if (city.alive) {
                    const gradient = ctx.createRadialGradient(
                        city.x, city.y - 10, 0,
                        city.x, city.y - 10, city.radius
                    );
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#008855');
                    ctx.fillStyle = gradient;
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(city.x, city.y - 10, city.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            // Draw battery (player launcher)
            ctx.fillStyle = '#00d2ff';
            ctx.shadowColor = '#00d2ff';
            ctx.shadowBlur = 10;
            ctx.fillRect(canvas.width / 2 - 15, canvas.height - 35, 30, 25);
            ctx.shadowBlur = 0;

            // Draw enemy silos (top)
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            ctx.shadowBlur = 8;
            for (let i = 0; i < 5; i++) {
                const x = 60 + i * 120;
                ctx.fillRect(x - 12, 5, 24, 15);
            }
            ctx.shadowBlur = 0;

            // Draw missiles
            missiles.forEach(missile => {
                ctx.strokeStyle = '#00d2ff';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#00d2ff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(missile.sx, missile.sy);
                ctx.lineTo(missile.x, missile.y);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(missile.x, missile.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw enemy missiles
            enemyMissiles.forEach(em => {
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 2;
                ctx.shadowColor = '#ff0055';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(em.sx, em.sy);
                ctx.lineTo(em.x, em.y);
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(em.x, em.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw explosions
            explosions.forEach(exp => {
                ctx.fillStyle = `rgba(255, 100, 50, ${exp.alpha})`;
                ctx.shadowColor = '#ff6633';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function update(deltaTime) {
            // Update missiles
            missiles = missiles.filter(missile => {
                const dx = missile.tx - missile.sx;
                const dy = missile.ty - missile.sy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const speed = 8;
                missile.x += (dx / dist) * speed;
                missile.y += (dy / dist) * speed;

                const remaining = Math.sqrt((missile.tx - missile.x) ** 2 + (missile.ty - missile.y) ** 2);
                if (remaining < speed) {
                    createExplosion(missile.tx, missile.ty);
                    return false;
                }
                return true;
            });

            // Update enemy missiles
            enemyMissiles = enemyMissiles.filter(em => {
                const dx = em.tx - em.sx;
                const dy = em.ty - em.sy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const speed = 1.5 + (wave * 0.3);
                em.x += (dx / dist) * speed;
                em.y += (dy / dist) * speed;

                const remaining = Math.sqrt((em.tx - em.x) ** 2 + (em.ty - em.y) ** 2);
                if (remaining < speed) {
                    // Check if hit city
                    cities.forEach(city => {
                        if (city.alive) {
                            const dx = city.x - em.tx;
                            const dy = (city.y - 10) - em.ty;
                            if (Math.sqrt(dx * dx + dy * dy) < city.radius + 15) {
                                city.alive = false;
                            }
                        }
                    });
                    createExplosion(em.tx, em.ty, 25);
                    return false;
                }

                // Check collision with explosions
                for (let exp of explosions) {
                    const dx = em.x - exp.x;
                    const dy = em.y - exp.y;
                    if (Math.sqrt(dx * dx + dy * dy) < exp.radius + 5) {
                        createExplosion(em.x, em.y, 20);
                        score += 50;
                        scoreEl.textContent = score;
                        return false;
                    }
                }

                return true;
            });

            // Update explosions
            explosions = explosions.filter(exp => {
                exp.radius += 0.5;
                exp.alpha -= 0.02;
                return exp.alpha > 0;
            });

            // Spawn enemy missiles
            enemySpawnTimer += deltaTime;
            if (enemySpawnTimer > enemySpawnInterval) {
                spawnEnemyMissile();
                enemySpawnTimer = 0;
            }

            // Check game over
            const aliveCities = cities.filter(c => c.alive).length;
            if (aliveCities === 0) {
                gameOver();
            }

            // Update UI
            citiesEl.textContent = aliveCities;
            ammoEl.textContent = ammo;
            waveEl.textContent = wave;
        }

        function createExplosion(x, y, maxRadius = 30) {
            explosions.push({ x, y, radius: 1, alpha: 1, maxRadius });
        }

        function spawnEnemyMissile() {
            const sx = 60 + Math.floor(Math.random() * 5) * 120;
            const sy = 20;
            const target = cities.filter(c => c.alive)[Math.floor(Math.random() * cities.filter(c => c.alive).length)];
            if (target) {
                enemyMissiles.push({
                    sx, sy,
                    x: sx, y: sy,
                    tx: target.x,
                    ty: target.y - 10
                });
            }
        }

        function launchMissile(e) {
            if (!gameRunning || ammo <= 0) return;

            const rect = canvas.getBoundingClientRect();
            const tx = e.clientX - rect.left;
            const ty = e.clientY - rect.top;

            missiles.push({
                sx: canvas.width / 2,
                sy: canvas.height - 35,
                x: canvas.width / 2,
                y: canvas.height - 35,
                tx, ty
            });
            ammo--;
            ammoEl.textContent = ammo;
        }

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('missile_command_best', highScore);
                highScoreEl.textContent = highScore;
            }
            finalScoreEl.textContent = score;
            gameOverOverlay.classList.add('active');
        }

        function nextWave() {
            wave++;
            enemyMissiles = [];
            explosions = [];
            missiles = [];
            ammo = 30;
            enemySpawnInterval = Math.max(500, 2000 - wave * 200);
            score += 100 * wave;
            scoreEl.textContent = score;
            waveEl.textContent = wave;
            ammoEl.textContent = ammo;
        }

        function startGame() {
            score = 0;
            wave = 1;
            ammo = 30;
            enemySpawnInterval = 2000;
            missiles = [];
            enemyMissiles = [];
            explosions = [];
            initCities();
            gameRunning = true;
            startOverlay.classList.remove('active');
            gameOverOverlay.classList.remove('active');
            scoreEl.textContent = score;
            waveEl.textContent = wave;
            ammoEl.textContent = ammo;
            citiesEl.textContent = cities.filter(c => c.alive).length;
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(currentTime) {
            if (!gameRunning) return;

            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            update(deltaTime);
            draw();

            // Check for wave completion (all enemies destroyed)
            if (enemyMissiles.length === 0 && explosions.length === 0 && wave < 10) {
                setTimeout(nextWave, 1000);
            }

            requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('click', launchMissile);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            launchMissile(e.touches[0]);
        });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        // Show start overlay
        startOverlay.classList.add('active');
        initCities();
        draw();

        // ── Hub communication ────────────────
        window.addEventListener('message', function (e) {
            if (e.data && e.data.type === 'theme') {
                if (e.data.value === 'light') {
                    document.body.classList.add('light');
                } else {
                    document.body.classList.remove('light');
                }
            }
            if (e.data && e.data.type === 'sound') {
                localStorage.setItem('sound_enabled', e.data.value ? '1' : '0');
            }
        });

        // Apply saved theme on direct load
        (function () {
            const theme = localStorage.getItem('theme') || 'dark';
            if (theme === 'light') document.body.classList.add('light');
        })();
    </script>
</body>
</html>
